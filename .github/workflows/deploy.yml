name: Deploy Static Website to Nginx

on:
  push:
    branches:
      - main

jobs:
  deploy:

    runs-on: self-hosted

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Website
        run: |
          sudo cp index.html /var/www/html/index.html
          sudo systemctl restart nginx

      - name: Check Nginx
        run: |
          sudo systemctl status nginx --no-pager
