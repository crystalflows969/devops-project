name: Deploy Static Website

on:
  push:
    branches:
      - main

jobs:
  deploy:

    runs-on: self-hosted

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Website
        run: |
          sudo cp index.html /var/www/html/index.html
          sudo systemctl restart apache2

      - name: Check Apache
        run: |
          sudo systemctl status apache2 --no-pager
